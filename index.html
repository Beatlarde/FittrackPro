<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitTrack Pro" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Tu coach de fitness y nutrición personalizado con IA" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>FitTrack Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrado:', reg.scope))
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
    <script>
      // --- Auto-actualización al reabrir la app ---------------------------
      // Los PWA agregados a la pantalla de inicio en iOS a veces se
      // "reanudan" en vez de recargarse de verdad al reabrirlos, así que
      // pueden quedar corriendo una versión vieja del código indefinidamente
      // aunque el usuario los cierre y los vuelva a abrir. Cada vez que la
      // app vuelve a primer plano, comparamos el bundle que tenemos cargado
      // contra el que hay ahorita en el servidor; si cambió (hubo un
      // deploy nuevo), recargamos solos, sin que el usuario tenga que
      // quitar y volver a agregar el ícono manualmente.
      (function () {
        var currentScript = document.querySelector('script[type="module"]');
        var currentSrc = currentScript ? currentScript.getAttribute('src') : null;
        if (!currentSrc) return;

        var checking = false;
        // Freno de seguridad: como máximo una recarga automática cada 30 s.
        // Evita ciclos infinitos si algo (p. ej. una caché) devuelve una versión vieja.
        function puedeRecargar() {
          try {
            var ultima = parseInt(sessionStorage.getItem('ftp_ultima_recarga') || '0', 10);
            if (Date.now() - ultima < 30000) return false;
            sessionStorage.setItem('ftp_ultima_recarga', String(Date.now()));
          } catch (e) { /* sin sessionStorage: se permite */ }
          return true;
        }

        function checkForUpdate() {
          if (checking) return;
          checking = true;
          // "/" + no-store + parámetro único: nunca debe salir de una caché
          fetch('/?v=' + Date.now(), { cache: 'no-store' })
            .then(function (res) { return res.text(); })
            .then(function (html) {
              var match = html.match(/<script[^>]+type="module"[^>]+src="([^"]+)"/);
              var latestSrc = match ? match[1] : null;
              if (latestSrc && latestSrc !== currentSrc && puedeRecargar()) {
                window.location.reload();
              }
            })
            .catch(function () { /* sin conexión: seguimos con lo que ya está cargado */ })
            .finally(function () { checking = false; });
        }

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkForUpdate();
        });
        window.addEventListener('pageshow', checkForUpdate);
      })();
    </script>
  </body>
</html>
